name: release

# Push a version tag and this builds the standalone executable and publishes it:
#
#     git tag v1.0.3
#     git push origin v1.0.3
#
# "Run workflow" from the Actions tab also works — it builds and uploads the
# exe as a run artifact without publishing a release, which is handy for
# checking a build before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # required to create the release

jobs:
  build:
    name: Build NetVitals.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywintrace

      # Never publish a build that does not pass its own tests.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Refresh the application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --write-ico

      - name: Build
        run: python -m PyInstaller --noconfirm --clean netvitals.spec

      - name: Check the executable is sane
        run: |
          if (-not (Test-Path dist\NetVitals.exe)) { throw "NetVitals.exe was not produced" }
          $size = (Get-Item dist\NetVitals.exe).Length
          Write-Host "Built dist\NetVitals.exe ($([math]::Round($size/1MB,1)) MB)"
          if ($size -lt 10MB) { throw "Executable is suspiciously small - the build is probably incomplete" }

      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetVitals-exe
          path: dist/NetVitals.exe

      # --- Microsoft Store package -------------------------------------
      # Built here rather than on a developer's machine so the package that
      # goes to the Store is reproducible, and so nobody needs the Windows SDK
      # locally: the runners already have it.
      #
      # Deliberately unsigned. The Store signs submissions with its own
      # certificate, and signing it here would risk a publisher mismatch that
      # fails validation.
      - name: Build the application folder for packaging
        run: python -m PyInstaller --noconfirm --clean netvitals-dir.spec

      - name: Stage the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_msix.py

      - name: Pack it
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object Name -match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          if (-not (Test-Path $makeappx)) { throw "makeappx not found under $($sdk.FullName)" }
          & $makeappx pack /d build\msix /p NetVitals.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - name: Check the package is sane
        run: |
          if (-not (Test-Path NetVitals.msix)) { throw "NetVitals.msix was not produced" }
          $size = (Get-Item NetVitals.msix).Length
          Write-Host "Built NetVitals.msix ($([math]::Round($size/1MB,1)) MB)"
          if ($size -lt 10MB) { throw "Package is suspiciously small - the build is probably incomplete" }

      - name: Upload the package as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetVitals-msix
          path: NetVitals.msix

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $hash = (Get-FileHash dist\NetVitals.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item dist\NetVitals.exe).Length / 1MB, 1)
          @"
          ## NetVitals ${{ github.ref_name }}

          A network usage monitor for Windows — upload and download per hour,
          day, week, month and year, broken down by application, with a log of
          the files that arrive on your machine.

          ### Download

          **[NetVitals.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetVitals.exe)** — $size MB, no Python required.

          Put it anywhere and run it. For the per-application breakdown,
          right-click it and choose **Run as administrator**; everything else
          works without.

          Windows SmartScreen will warn on first run because the file is not
          code-signed. **More info -> Run anyway**. Verify it first if you like:

          ``````
          SHA-256: $hash
          ``````

          ### Microsoft Store

          The Store build is the same application without the per-application
          breakdown, which Windows does not permit a packaged app to collect.
          Everything else — totals, history, the direct/VPN split and the file
          log — works identically.

          ### Running from source instead

          Clone the repository and use ``install.bat`` — see the README.
          "@ | Out-File -FilePath notes.md -Encoding utf8

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - replacing the executable"
            gh release upload $tag dist/NetVitals.exe NetVitals.msix --clobber
          } else {
            gh release create $tag dist/NetVitals.exe NetVitals.msix --title "NetVitals $tag" --notes-file notes.md
          }
